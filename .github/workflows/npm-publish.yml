name: npm publish

# Manual only. The package is distributed through ClawHub, not npm
# (@fintlp/openclaw-meshtastic is not published on npm). A release-triggered
# run would publish to the public npm registry as a side effect of every
# GitHub release, so the release trigger was removed.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
